name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon --console=plain
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roadscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
